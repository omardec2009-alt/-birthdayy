<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كل سنة وإنتي طيبة يا حوراء ❤️</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;

      background:
        radial-gradient(
          circle at 10% 15%,
          rgba(255,255,255,0.9),
          transparent 22%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(255,205,225,0.75),
          transparent 28%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(255,190,215,0.7),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 90%,
          rgba(255,225,235,0.8),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ffe5ef,
          #ffc9dd,
          #f8b3cf
        );

      color: #6d304d;
      min-height: 100vh;
      overflow-x: hidden;
    }


    /* =====================================================
       HAPPY BIRTHDAY HEADER
    ===================================================== */

    .birthday-arch {
      position: absolute;
      top: -65px;
      left: 50%;

      transform: translateX(-50%);

      width: 100%;
      height: 190px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding-bottom: 20px;

      z-index: 2;
      pointer-events: none;
    }

    .birthday-text {
      color: rgba(255,255,255,0.48);

      font-size: clamp(20px, 4vw, 38px);

      font-weight: bold;
      letter-spacing: 3px;

      text-shadow:
        0 2px 8px rgba(170,60,100,0.15);

      opacity: 0.85;
    }


    /* =====================================================
       FLOATING HEARTS
    ===================================================== */

    .hearts {
      position: fixed;
      inset: 0;

      pointer-events: none;
      overflow: hidden;

      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -60px;

      color: #e96f9d;
      font-size: 20px;

      animation:
        float 9s linear infinite;

      opacity: 0;

      filter:
        drop-shadow(
          0 3px 5px rgba(190,60,110,0.2)
        );
    }

    .heart:nth-child(2n) {
      color: #ff8fb8;
      font-size: 27px;
    }

    .heart:nth-child(3n) {
      color: #d95787;
      font-size: 16px;
    }

    .heart:nth-child(4n) {
      color: #f6a6c3;
      font-size: 34px;
    }

    @keyframes float {

      0% {
        transform:
          translateY(0)
          translateX(0)
          rotate(0deg)
          scale(0.8);

        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      50% {
        transform:
          translateY(-55vh)
          translateX(35px)
          rotate(180deg)
          scale(1);
      }

      100% {
        transform:
          translateY(-115vh)
          translateX(-35px)
          rotate(360deg)
          scale(0.8);

        opacity: 0;
      }
    }


    /* =====================================================
       WHITE CARNATIONS WITH ROSE TIPS
    ===================================================== */

    .carnations {
      position: fixed;
      inset: 0;

      pointer-events: none;
      overflow: hidden;

      z-index: 0;
    }

    .carnation {
      position: absolute;

      width: 130px;
      height: 170px;

      opacity: 0.92;

      transform-origin: center bottom;

      animation:
        flowerSway 6s ease-in-out infinite;

      filter:
        drop-shadow(
          0 8px 12px rgba(130,40,75,0.18)
        );
    }


    /* STEM */

    .carnation::before {
      content: "";

      position: absolute;

      width: 8px;
      height: 120px;

      left: 61px;
      top: 48px;

      border-radius: 100%;

      background:
        linear-gradient(
          90deg,
          #386f43,
          #7bbd79,
          #3e7949
        );

      transform: rotate(8deg);

      box-shadow:
        2px 0 4px rgba(40,90,45,0.2);
    }


    /* FLOWER HEAD */

    .carnation::after {
      content: "";

      position: absolute;

      width: 105px;
      height: 100px;

      left: 10px;
      top: 0;

      background:
        radial-gradient(
          ellipse at 50% 42%,
          #ffffff 0%,
          #fffefe 28%,
          #fffafa 45%,
          #fff0f4 60%,
          #f4c4d3 72%,
          #e581a4 85%,
          #bd4f77 100%
        );

      clip-path: polygon(
        50% 0%,
        57% 8%,
        65% 2%,
        69% 14%,
        79% 7%,
        80% 19%,
        93% 16%,
        89% 29%,
        100% 32%,
        92% 42%,
        99% 52%,
        88% 58%,
        96% 70%,
        83% 71%,
        84% 85%,
        70% 79%,
        63% 96%,
        52% 84%,
        42% 99%,
        34% 84%,
        20% 92%,
        22% 77%,
        7% 82%,
        14% 68%,
        0% 63%,
        11% 52%,
        0% 42%,
        12% 33%,
        5% 22%,
        19% 23%,
        18% 10%,
        32% 16%,
        40% 4%
      );

      box-shadow:
        inset 0 0 18px rgba(255,255,255,0.9),
        inset 0 -5px 13px rgba(220,100,140,0.18),
        0 6px 13px rgba(140,50,85,0.2);
    }


    /* INNER PETALS */

    .carnation-inner {
      position: absolute;

      width: 65px;
      height: 65px;

      left: 30px;
      top: 18px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #fffafa 22%,
          #ffe9f0 40%,
          #f4bdcf 56%,
          #df7898 74%,
          #b94770 100%
        );

      clip-path: polygon(
        50% 0%,
        60% 10%,
        73% 3%,
        76% 18%,
        92% 18%,
        82% 32%,
        99% 43%,
        83% 51%,
        93% 65%,
        76% 67%,
        72% 84%,
        58% 74%,
        48% 92%,
        38% 75%,
        23% 84%,
        25% 67%,
        8% 65%,
        17% 51%,
        2% 42%,
        18% 32%,
        8% 18%,
        25% 18%,
        28% 4%,
        41% 11%
      );

      box-shadow:
        inset 0 0 13px rgba(255,255,255,0.85);
    }


    /* LEAVES */

    .carnation-leaf {
      position: absolute;

      width: 45px;
      height: 17px;

      background:
        linear-gradient(
          135deg,
          #356d40,
          #78b676,
          #477d4c
        );

      border-radius:
        100% 0 100% 0;

      z-index: 3;

      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.3);
    }

    .leaf-left {
      left: 20px;
      top: 95px;

      transform: rotate(-28deg);
    }

    .leaf-right {
      left: 68px;
      top: 116px;

      transform:
        rotate(25deg)
        scaleX(-1);
    }


    /* FLOWER POSITIONS */

    .carnation-1 {
      top: -15px;
      left: -35px;

      transform:
        rotate(-20deg)
        scale(1.1);
    }

    .carnation-2 {
      top: 10px;
      right: -38px;

      transform:
        rotate(20deg)
        scale(1.15);

      animation-delay: 1s;
    }

    .carnation-3 {
      bottom: -20px;
      left: -35px;

      transform:
        rotate(-18deg)
        scale(1.2);

      animation-delay: 2s;
    }

    .carnation-4 {
      bottom: -20px;
      right: -35px;

      transform:
        rotate(18deg)
        scale(1.15);

      animation-delay: 3s;
    }

    .carnation-5 {
      top: 43%;
      left: -50px;

      transform:
        rotate(-16deg)
        scale(0.72);

      animation-delay: 1.5s;
    }

    .carnation-6 {
      top: 50%;
      right: -50px;

      transform:
        rotate(16deg)
        scale(0.75);

      animation-delay: 2.5s;
    }

    @keyframes flowerSway {

      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -8px;
      }
    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .container {
      position: relative;

      z-index: 1;

      width: min(900px, 92%);

      margin: auto;

      padding: 60px 0;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      min-height: 90vh;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding-top: 75px;
    }


    /* =====================================================
       REALISTIC SWEET 16 CAKE
    ===================================================== */

    .cake {
      position: relative;

      width: 200px;
      height: 195px;

      margin-bottom: 25px;

      animation:
        cakeBounce 2.5s ease-in-out infinite;

      filter:
        drop-shadow(
          0 18px 18px rgba(150,50,90,0.22)
        );
    }


    /* PLATE */

    .cake-plate {
      position: absolute;

      bottom: 2px;
      left: 50%;

      transform: translateX(-50%);

      width: 180px;
      height: 22px;

      background:
        linear-gradient(
          to bottom,
          #ffffff,
          #f3d8e4
        );

      border-radius: 50%;

      box-shadow:
        0 6px 13px rgba(120,40,70,0.18),
        inset 0 2px 2px rgba(255,255,255,0.95);
    }


    /* BOTTOM CAKE */

    .cake-bottom {
      position: absolute;

      bottom: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: 140px;
      height: 64px;

      border-radius:
        12px
        12px
        18px
        18px;

      background:
        linear-gradient(
          to right,
          #d59884,
          #f7cdbb 12%,
          #fff0e7 30%,
          #ffe7dd 50%,
          #fff1e8 70%,
          #edbdaa 88%,
          #cd8978
        );

      border:
        2px solid rgba(255,255,255,0.9);

      box-shadow:
        inset 0 -12px 0 rgba(181,104,105,0.12),
        inset 0 6px 10px rgba(255,255,255,0.85),
        0 7px 12px rgba(130,50,70,0.15);
    }


    /* CREAM LAYER */

    .cake-bottom::before {
      content: "";

      position: absolute;

      left: 0;
      top: 20px;

      width: 100%;
      height: 9px;

      background:
        linear-gradient(
          to right,
          #fff8f9,
          #ffffff,
          #fff1f4
        );

      box-shadow:
        0 2px 3px rgba(180,80,110,0.12);
    }


    /* BOTTOM DECORATIONS */

    .cake-bottom::after {
      content:
        "•  ♥  •  ♥  •";

      position: absolute;

      bottom: 7px;
      left: 0;

      width: 100%;

      text-align: center;

      color: #d35c87;

      font-size: 13px;

      letter-spacing: 5px;
    }


    /* PINK FROSTING */

    .cake-frosting {
      position: absolute;

      bottom: 70px;
      left: 50%;

      transform: translateX(-50%);

      width: 150px;
      height: 38px;

      border-radius:
        50%
        50%
        45%
        45%;

      background:
        linear-gradient(
          to bottom,
          #ffc7dc,
          #f99cbd 50%,
          #df638f
        );

      box-shadow:
        inset 0 5px 8px rgba(255,255,255,0.55),
        0 6px 10px rgba(170,50,90,0.17);
    }


    /* FROSTING DRIPS */

    .cake-frosting::before {
      content: "";

      position: absolute;

      left: 14px;
      bottom: -18px;

      width: 20px;
      height: 27px;

      background:
        linear-gradient(
          to bottom,
          #fa91b7,
          #dc638f
        );

      border-radius:
        0
        0
        13px
        13px;

      box-shadow:
        32px 5px 0 -1px #f184ac,
        67px -1px 0 -2px #eb759f,
        105px 5px 0 -2px #e67aa2;
    }


    /* TOP ICING */

    .cake-top {
      position: absolute;

      left: 50%;
      bottom: 94px;

      transform: translateX(-50%);

      width: 140px;
      height: 40px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at center,
          #ffffff 0%,
          #fffafa 35%,
          #ffeaf3 65%,
          #ffc8dc 100%
        );

      box-shadow:
        inset 0 5px 9px rgba(255,255,255,0.95),
        0 5px 8px rgba(170,60,100,0.13);
    }


    .cake-top::before {
      content:
        "♥  •  ♥  •  ♥";

      position: absolute;

      top: 8px;
      left: 0;

      width: 100%;

      text-align: center;

      color: #df638f;

      font-size: 14px;

      letter-spacing: 4px;
    }


    /* =====================================================
       SWEET 16 TOPPER
    ===================================================== */

    .sixteen {
      position: absolute;

      z-index: 20;

      top: 0;
      left: 50%;

      transform: translateX(-50%);

      color: white;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 62px;

      font-weight: bold;

      line-height: 1;

      text-shadow:
        0 2px 0 #d65384,
        0 4px 8px rgba(130,40,80,0.28);

      animation:
        topperGlow 2s ease-in-out infinite;
    }


    /* TOPPER STICK */

    .sixteen::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 57px;

      transform: translateX(-50%);

      width: 4px;
      height: 45px;

      border-radius: 4px;

      background:
        linear-gradient(
          to bottom,
          #d99db5,
          #a96b86
        );
    }


    @keyframes topperGlow {

      0%,
      100% {
        filter:
          drop-shadow(
            0 3px 5px rgba(180,50,100,0.2)
          );
      }

      50% {
        filter:
          drop-shadow(
            0 0 13px rgba(255,255,255,0.85)
          );
      }
    }


    /* =====================================================
       CANDLES
    ===================================================== */

    .candle {
      position: absolute;

      bottom: 108px;

      width: 11px;
      height: 31px;

      border-radius: 4px;

      background:
        repeating-linear-gradient(
          -45deg,
          #fff9fb 0px,
          #fff9fb 5px,
          #efa1bc 5px,
          #efa1bc 9px
        );

      border:
        1px solid rgba(190,80,120,0.2);

      box-shadow:
        0 2px 5px rgba(150,50,90,0.15);
    }

    .candle-left {
      left: 47px;

      transform: rotate(-5deg);
    }

    .candle-right {
      right: 47px;

      transform: rotate(5deg);
    }

    .candle::before {
      content: "";

      position: absolute;

      top: -6px;
      left: 50%;

      width: 2px;
      height: 7px;

      transform: translateX(-50%);

      background: #553b3b;

      border-radius: 50%;
    }


    /* FLAMES */

    .flame {
      position: absolute;

      bottom: 134px;

      width: 18px;
      height: 18px;

      border-radius:
        50%
        50%
        50%
        0;

      background:
        radial-gradient(
          circle at 60% 60%,
          #fffbd0 0%,
          #ffe06d 35%,
          #ffad69 65%,
          #f47b9f 100%
        );

      filter:
        drop-shadow(
          0 0 9px rgba(255,180,90,0.75)
        );

      animation:
        flameFlicker
        0.7s
        ease-in-out
        infinite
        alternate;
    }

    .flame-left {
      left: 44px;

      transform: rotate(45deg);
    }

    .flame-right {
      right: 44px;

      transform: rotate(45deg);
    }

    @keyframes flameFlicker {

      from {
        transform:
          rotate(42deg)
          scale(0.9);
      }

      to {
        transform:
          rotate(48deg)
          scale(1.12);
      }
    }


    @keyframes cakeBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }


    /* =====================================================
       HERO TEXT
    ===================================================== */

    h1 {
      font-size:
        clamp(
          38px,
          8vw,
          72px
        );

      color: #c94f80;

      text-shadow:
        0 0 25px
        rgba(255,120,180,0.35);

      margin-bottom: 10px;
    }

    .sweet-sixteen {
      margin: 5px 0 14px;

      color: #bd4778;

      font-family:
        Georgia,
        serif;

      font-size: 25px;

      font-weight: bold;

      letter-spacing: 3px;

      text-shadow:
        0 2px 8px rgba(190,70,120,0.18);
    }

    .subtitle {
      font-size: 20px;

      color: #713650;

      line-height: 1.8;
    }

    .scroll {
      margin-top: 60px;

      color: #c94f80;

      animation:
        pulse 2s infinite;

      font-weight: bold;
    }

    @keyframes pulse {

      50% {
        opacity: 0.4;
      }
    }


    /* =====================================================
       SECTIONS
    ===================================================== */

    section {
      background:
        rgba(255,255,255,0.42);

      border:
        1px solid
        rgba(255,255,255,0.7);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      border-radius: 25px;

      padding: 35px;

      margin: 30px 0;

      box-shadow:
        0 15px 50px
        rgba(180,70,120,0.13),

        inset 0 1px 0
        rgba(255,255,255,0.6);
    }

    section h2 {
      color: #c34f7d;

      margin-bottom: 20px;

      font-size: 28px;
    }


    /* =====================================================
       LOVE LETTER
    ===================================================== */

    .letter {
      font-size: 19px;

      line-height: 2.2;

      color: #663047;

      overflow-wrap: break-word;
    }

    .letter strong {
      color: #b83f70;
    }


    /* =====================================================
       REASONS
    ===================================================== */

    .reasons {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 15px;
    }

    .reason {
      background:
        rgba(255,160,200,0.25);

      border-radius: 18px;

      padding: 20px;

      text-align: center;

      line-height: 1.8;

      border:
        1px solid
        rgba(255,180,210,0.35);

      color: #743550;

      transition:
        0.3s ease;
    }

    .reason:hover {
      transform:
        translateY(-5px);

      background:
        rgba(255,170,205,0.4);

      box-shadow:
        0 10px 25px
        rgba(190,70,120,0.15);
    }


    /* =====================================================
       PHOTO GALLERY
    ===================================================== */

    .photos {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 30px;

      width: 100%;

      align-items: start;
    }


    /* PHOTO FRAME */

    .photo-card {
      position: relative;

      width: 100%;

      min-height: 250px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 13px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #fff7fa
        );

      border:
        1px solid
        rgba(210,120,155,0.35);

      border-radius: 7px;

      box-shadow:
        0 8px 15px
        rgba(130,50,85,0.12),

        0 20px 35px
        rgba(130,50,85,0.10),

        inset 0 0 0 2px
        rgba(255,255,255,0.8);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;

      transform:
        rotate(var(--rotation));
    }


    /* INNER FRAME */

    .photo-card::before {
      content: "";

      position: absolute;

      inset: 6px;

      border:
        1px solid
        rgba(220,130,160,0.35);

      pointer-events: none;
    }


    /* LITTLE HEART */

    .photo-card::after {
      content: "♥";

      position: absolute;

      right: -9px;
      top: -13px;

      width: 30px;
      height: 30px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #d95b89;

      background: #fff4f8;

      border-radius: 50%;

      box-shadow:
        0 3px 8px
        rgba(130,50,85,0.15);

      font-size: 14px;

      z-index: 5;
    }


    .photo-card:hover {
      transform:
        rotate(0deg)
        translateY(-9px)
        scale(1.025);

      box-shadow:
        0 15px 25px
        rgba(130,50,85,0.16),

        0 25px 45px
        rgba(130,50,85,0.12);
    }


    /* THE ACTUAL PHOTOS */

    .photo-card img {
      display: block;

      width: auto;

      height: auto;

      max-width: 100%;

      max-height: 290px;

      object-fit: contain;

      border-radius: 3px;

      margin: 0 auto;

      box-shadow:
        0 2px 7px
        rgba(100,40,70,0.16);
    }


    /* PHOTO ROTATIONS */

    .photo-card:nth-child(1) {
      --rotation: -2deg;
    }

    .photo-card:nth-child(2) {
      --rotation: 2deg;
    }

    .photo-card:nth-child(3) {
      --rotation: -1.5deg;
    }

    .photo-card:nth-child(4) {
      --rotation: 2.5deg;
    }

    .photo-card:nth-child(5) {
      --rotation: -2.5deg;
    }

    .photo-card:nth-child(6) {
      --rotation: 1.5deg;
    }

    .photo-card:nth-child(7) {
      --rotation: -1deg;
    }


    /* =====================================================
       VOICE SECTION
       VOICE3 NOT ADDED YET
    ===================================================== */

    .voice {
      background:
        rgba(255,255,255,0.3);

      padding: 20px;

      border-radius: 18px;

      margin-top: 15px;

      color: #743550;
    }


    /* =====================================================
       FINAL MESSAGE
    ===================================================== */

    .final {
      text-align: center;

      padding: 70px 25px;
    }

    .final h2 {
      font-size: 36px;

      color: #bd4778;

      line-height: 1.5;
    }

    .final p {
      font-size: 21px;

      line-height: 2;

      color: #713650;
    }

    .signature {
