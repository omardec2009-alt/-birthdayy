<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كل سنة وإنتي طيبة يا حوراء ❤️</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Tahoma", "Arial", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: #6d304d;

      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,0.95), transparent 25%),
        radial-gradient(circle at 90% 18%, rgba(255,220,235,0.9), transparent 30%),
        radial-gradient(circle at 15% 85%, rgba(255,195,220,0.8), transparent 28%),
        radial-gradient(circle at 85% 88%, rgba(255,240,246,0.9), transparent 30%),
        linear-gradient(135deg, #ffeaf2 0%, #ffd4e3 45%, #f6b8d0 100%);

      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: -2;

      background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.3), transparent 20%),
        radial-gradient(circle at 70% 65%, rgba(255,140,190,0.13), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,0.2), transparent 30%);

      animation: ambientGlow 12s ease-in-out infinite alternate;
    }

    @keyframes ambientGlow {
      from {
        transform: scale(1) translate(0, 0);
        opacity: 0.65;
      }

      to {
        transform: scale(1.1) translate(1%, -1%);
        opacity: 1;
      }
    }


    /* =========================================================
       CALM MUSIC-LIKE BACKGROUND
    ========================================================= */

    .music-vibe {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: 0.45;
    }

    .music-orb {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.34) 0%,
          rgba(255,190,220,0.16) 35%,
          transparent 70%
        );

      filter: blur(12px);
      animation: orbDrift 16s ease-in-out infinite alternate;
    }

    .orb1 {
      left: -80px;
      top: 12%;
    }

    .orb2 {
      right: -100px;
      top: 35%;
      width: 320px;
      height: 320px;
      animation-delay: -5s;
      animation-duration: 19s;
    }

    .orb3 {
      left: 28%;
      bottom: -130px;
      width: 360px;
      height: 360px;
      animation-delay: -8s;
      animation-duration: 21s;
    }

    @keyframes orbDrift {
      0% {
        transform: translate3d(-20px, 20px, 0) scale(0.9);
      }

      50% {
        transform: translate3d(40px, -35px, 0) scale(1.08);
      }

      100% {
        transform: translate3d(-15px, -60px, 0) scale(0.96);
      }
    }

    .sound-wave {
      position: absolute;
      left: 50%;
      top: 50%;

      width: 90vw;
      max-width: 900px;
      height: 180px;

      transform: translate(-50%, -50%);
      opacity: 0.17;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      filter: blur(0.2px);
    }

    .sound-bar {
      width: 4px;
      min-height: 20px;
      border-radius: 50px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.9),
          rgba(214,91,142,0.65),
          rgba(255,255,255,0.8)
        );

      animation: gentleWave 3.5s ease-in-out infinite;
    }

    .sound-bar:nth-child(1) { height: 34px; animation-delay: -1.2s; }
    .sound-bar:nth-child(2) { height: 55px; animation-delay: -0.8s; }
    .sound-bar:nth-child(3) { height: 78px; animation-delay: -1.7s; }
    .sound-bar:nth-child(4) { height: 110px; animation-delay: -0.4s; }
    .sound-bar:nth-child(5) { height: 70px; animation-delay: -2s; }
    .sound-bar:nth-child(6) { height: 125px; animation-delay: -1s; }
    .sound-bar:nth-child(7) { height: 88px; animation-delay: -2.3s; }
    .sound-bar:nth-child(8) { height: 135px; animation-delay: -0.6s; }
    .sound-bar:nth-child(9) { height: 92px; animation-delay: -1.4s; }
    .sound-bar:nth-child(10) { height: 115px; animation-delay: -2.1s; }
    .sound-bar:nth-child(11) { height: 73px; animation-delay: -0.9s; }
    .sound-bar:nth-child(12) { height: 125px; animation-delay: -1.8s; }
    .sound-bar:nth-child(13) { height: 85px; animation-delay: -0.3s; }
    .sound-bar:nth-child(14) { height: 58px; animation-delay: -1.5s; }
    .sound-bar:nth-child(15) { height: 35px; animation-delay: -2.4s; }

    @keyframes gentleWave {
      0%, 100% {
        transform: scaleY(0.45);
        opacity: 0.45;
      }

      50% {
        transform: scaleY(1);
        opacity: 0.95;
      }
    }

    .music-note {
      position: absolute;
      color: rgba(255,255,255,0.58);
      font-size: 23px;
      text-shadow: 0 0 15px rgba(214,75,130,0.3);
      animation: musicFloat linear infinite;
    }

    .music-note:nth-child(17) {
      left: 8%;
      animation-duration: 15s;
    }

    .music-note:nth-child(18) {
      left: 25%;
      animation-duration: 19s;
      animation-delay: -5s;
    }

    .music-note:nth-child(19) {
      left: 45%;
      animation-duration: 16s;
      animation-delay: -9s;
    }

    .music-note:nth-child(20) {
      left: 67%;
      animation-duration: 21s;
      animation-delay: -3s;
    }

    .music-note:nth-child(21) {
      left: 87%;
      animation-duration: 17s;
      animation-delay: -11s;
    }

    @keyframes musicFloat {
      0% {
        bottom: -60px;
        opacity: 0;
        transform: translateX(0) rotate(-10deg) scale(0.7);
      }

      15% {
        opacity: 0.55;
      }

      50% {
        transform: translateX(35px) rotate(10deg) scale(1);
      }

      100% {
        bottom: 110%;
        opacity: 0;
        transform: translateX(-35px) rotate(-10deg) scale(0.8);
      }
    }


    /* =========================================================
       FLOATING HEARTS
    ========================================================= */

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      color: rgba(220,80,130,0.35);
      font-size: 20px;

      animation:
        floatHeart
        10s
        linear
        infinite;

      filter: drop-shadow(0 3px 6px rgba(190,60,110,0.12));
    }

    .heart:nth-child(2n) {
      color: rgba(255,255,255,0.55);
      font-size: 27px;
    }

    .heart:nth-child(3n) {
      font-size: 16px;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(0.7);
        opacity: 0;
      }

      15% {
        opacity: 0.65;
      }

      50% {
        transform: translateY(-55vh) translateX(35px) rotate(180deg) scale(1);
      }

      100% {
        transform: translateY(-115vh) translateX(-35px) rotate(360deg) scale(0.8);
        opacity: 0;
      }
    }


    /* =========================================================
       TOP BIRTHDAY TEXT
    ========================================================= */

    .birthday-arch {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);

      width: 100%;
      height: 170px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding-bottom: 22px;
      z-index: 3;
      pointer-events: none;
    }

    .birthday-text {
      color: rgba(255,255,255,0.78);
      font-size: clamp(20px, 4vw, 38px);
      font-weight: bold;
      letter-spacing: 3px;

      text-shadow:
        0 2px 8px rgba(170,60,100,0.16),
        0 0 20px rgba(255,255,255,0.6);

      animation: titleGlow 4s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from {
        text-shadow:
          0 2px 8px rgba(170,60,100,0.16),
          0 0 15px rgba(255,255,255,0.45);
      }

      to {
        text-shadow:
          0 2px 10px rgba(170,60,100,0.2),
          0 0 30px rgba(255,255,255,0.9);
      }
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .container {
      position: relative;
      z-index: 1;
      width: min(950px, 92%);
      margin: auto;
      padding: 55px 0;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 92vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding-top: 65px;
    }


    /* =========================================================
       REALISTIC CAKE
    ========================================================= */

    .cake {
      position: relative;
      width: 230px;
      height: 215px;
      margin-bottom: 35px;

      animation:
        cakeFloat
        3.2s
        ease-in-out
        infinite;

      filter:
        drop-shadow(
          0 20px 18px rgba(120,40,75,0.2)
        );
    }

    .cake-plate {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);

      width: 215px;
      height: 25px;
      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          #ffffff,
          #f7edf2 55%,
          #e9cdd9
        );

      box-shadow:
        0 7px 12px rgba(100,40,70,0.18),
        inset 0 3px 3px rgba(255,255,255,0.95);
    }

    .cake-plate::after {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 4px;
      height: 6px;
      border-radius: 50%;
      background: rgba(205,135,165,0.2);
    }

    .cake-bottom {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);

      width: 165px;
      height: 68px;

      border-radius: 13px 13px 18px 18px;

      background:
        linear-gradient(
          90deg,
          #d99b83 0%,
          #f4c7b4 10%,
          #ffe7dc 28%,
          #fff7f1 50%,
          #ffe4d8 72%,
          #f1bfaa 90%,
          #d28e7b 100%
        );

      border: 2px solid rgba(255,255,255,0.85);

      box-shadow:
        inset 0 -12px 10px rgba(160,75,75,0.12),
        inset 0 5px 9px rgba(255,255,255,0.85),
        0 7px 10px rgba(120,45,65,0.14);
    }

    .cake-bottom::before {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 16px;
      height: 8px;
      border-radius: 50%;

      background:
        linear-gradient(
          to right,
          #fff9f8,
          #ffffff,
          #fff2f4
        );

      box-shadow:
        0 22px 0 rgba(255,255,255,0.48);
    }

    .cake-bottom::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 14px;
      left: 0;
      bottom: 0;

      border-radius: 0 0 16px 16px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(173,87,87,0.1)
        );
    }

    .cake-frosting {
      position: absolute;
      bottom: 73px;
      left: 50%;
      transform: translateX(-50%);

      width: 177px;
      height: 43px;
      border-radius: 50%;

      background:
        linear-gradient(
          to bottom,
          #fffafa 0%,
          #fff2f7 35%,
          #ffd5e4 68%,
          #ef9dbd 100%
        );

      box-shadow:
        inset 0 5px 9px rgba(255,255,255,0.9),
        inset 0 -5px 7px rgba(190,80,120,0.1),
        0 5px 9px rgba(150,50,90,0.13);
    }

    .cake-frosting::before {
      content: "";
      position: absolute;
      left: 13px;
      bottom: -20px;

      width: 23px;
      height: 30px;

      border-radius: 0 0 14px 14px;

      background:
        linear-gradient(
          to bottom,
          #ffd8e6,
          #ee9fbd
        );

      box-shadow:
        39px 5px 0 -2px #f2aec8,
        81px 1px 0 -3px #efa1bd,
        119px 6px 0 -2px #f4b2ca;
    }

    .cake-top {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);

      width: 171px;
      height: 48px;
      border-radius: 50%;

      background:
        radial-gradient(
          ellipse at 45% 42%,
          #ffffff 0%,
          #fffafa 35%,
          #ffeef5 65%,
          #ffc8db 100%
        );

      border: 1px solid rgba(255,255,255,0.9);

      box-shadow:
        inset 0 5px 9px rgba(255,255,255,0.95),
        inset 0 -4px 8px rgba(220,110,150,0.12),
        0 5px 8px rgba(150,50,90,0.12);
    }

    .berry {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #fff,
          #f39cbd 30%,
          #c94f80 100%
        );

      box-shadow:
        0 2px 4px rgba(130,40,75,0.2);

      z-index: 5;
    }

    .berry.b1 {
      left: 45px;
      bottom: 103px;
    }

    .berry.b2 {
      left: 73px;
      bottom: 91px;
    }

    .berry.b3 {
      right: 45px;
      bottom: 103px;
    }

    .berry.b4 {
      right: 72px;
      bottom: 91px;
    }

    .age {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 104px;
      transform: translateX(-50%);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: bold;
      color: #cf5787;

      text-shadow:
        0 1px 0 white,
        0 3px 5px rgba(150,50,90,0.18);

      letter-spacing: -2px;
    }

    .candle {
      position: absolute;
      bottom: 132px;

      width: 14px;
      height: 45px;
      border-radius: 5px;

      background:
        repeating-linear-gradient(
          -45deg,
          #fffdfd 0px,
          #fffdfd 6px,
          #f0a2bf 6px,
          #f0a2bf 11px
        );

      border: 1px solid rgba(170,70,110,0.2);

      box-shadow:
        inset 2px 0 3px rgba(255,255,255,0.8),
        0 3px 6px rgba(130,50,80,0.18);

      z-index: 8;
    }

    .candle.one {
      left: 91px;
    }

    .candle.six {
      left: 126px;
    }

    .candle::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;

      width: 3px;
      height: 8px;

      transform: translateX(-50%);

      background: #4d3636;
      border-radius: 50%;
    }

    .flame {
      position: absolute;
      z-index: 9;
      bottom: 174px;

      width: 19px;
      height: 25px;

      border-radius: 50% 50% 50% 0;
      transform: rotate(45deg);

      background:
        radial-gradient(
          circle at 60% 65%,
          #fffde5 0%,
          #ffe77a 28%,
          #ffad69 58%,
          #f1789e 100%
        );

      filter:
        drop-shadow(
          0 0 10px rgba(255,185,95,0.8)
        );

      animation:
        flameFlicker
        0.65s
        ease-in-out
        infinite
        alternate;
    }

    .flame.one {
      left: 89px;
    }

    .flame.six {
      left: 124px;
      animation-delay: 0.18s;
    }

    @keyframes flameFlicker {
      from {
        transform: rotate(40deg) scale(0.9);
      }

      to {
        transform: rotate(49deg) scale(1.12);
      }
    }

    @keyframes cakeFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }


    /* =========================================================
       HERO TEXT
    ========================================================= */

    h1 {
      font-size: clamp(38px, 8vw, 72px);
      color: #c94f80;

      text-shadow:
        0 0 25px rgba(255,120,180,0.3);

      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 20px;
      color: #713650;
      line-height: 1.8;
      max-width: 750px;
    }

    .scroll {
      margin-top: 55px;
      color: #c94f80;

      animation:
        scrollPulse
        2s
        infinite;

      font-weight: bold;
    }

    @keyframes scrollPulse {
      50% {
        opacity: 0.35;
        transform: translateY(5px);
      }
    }


    /* =========================================================
       GLASS SECTIONS
    ========================================================= */

    section {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.56),
          rgba(255,240,247,0.34)
        );

      border:
        1px solid rgba(255,255,255,0.8);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 28px;
      padding: 38px;
      margin: 30px 0;

      box-shadow:
        0 18px 55px rgba(180,70,120,0.13),
        inset 0 1px 0 rgba(255,255,255,0.8);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
    }

    section:hover {
      box-shadow:
        0 22px 65px rgba(180,70,120,0.17),
        inset 0 1px 0 rgba(255,255,255,0.9);
    }

    section::before {
      content: "";
      position: absolute;

      width: 180px;
      height: 180px;

      top: -100px;
      right: -80px;

      border-radius: 50%;
      background: rgba(255,255,255,0.2);

      filter: blur(4px);
      pointer-events: none;
    }

    section h2 {
      color: #c34f7d;
      margin-bottom: 20px;
      font-size: 28px;

      position: relative;
      z-index: 1;
    }


    /* =========================================================
       LOVE LETTER
    ========================================================= */

    .letter {
      position: relative;
      z-index: 1;

      font-size: 19px;
      line-height: 2.2;
      color: #663047;
    }

    .letter strong {
      color: #b83f70;
    }


    /* =========================================================
       REASONS
    ========================================================= */

    .reasons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;

      position: relative;
      z-index: 1;
    }

    .reason {
      background: rgba(255,170,205,0.25);

      border-radius: 20px;
      padding: 21px;

      text-align: center;
      line-height: 1.8;

      border:
        1px solid rgba(255,180,210,0.5);

      color: #743550;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55);

      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        background 0.35s ease;
    }

    .reason:hover {
      transform:
        translateY(-6px)
        scale(1.015);

      background:
        rgba(255,180,215,0.38);

      box-shadow:
        0 12px 27px rgba(190,70,120,0.14);
    }


    /* =========================================================
       PHOTOS
    ========================================================= */

    .photos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      width: 100%;

      position: relative;
      z-index: 1;
    }

    .photo-card {
      position: relative;

      width: fit-content;
      height: fit-content;

      padding: 11px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.95),
          rgba(255,246,250,0.92)
        );

      border:
        2px solid #f1abc6;

      border-radius: 19px;

      box-shadow:
        0 8px 23px rgba(150,60,100,0.13),
        0 0 0 4px rgba(255,255,255,0.55);

      transition:
        transform 0.45s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.45s ease;

      overflow: visible;
      cursor: pointer;
    }

    .photo-card::before {
      content: "";

      position: absolute;
      inset: 5px;

      border:
        1px solid rgba(238,140,180,0.35);

      border-radius: 14px;
      pointer-events: none;
      z-index: 1;
    }

    .photo-card::after {
      content: "♥";

      position: absolute;
      right: -10px;
      top: -12px;

      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #fff,
          #fff2f7
        );

      border:
        1px solid #f0b2ca;

      border-radius: 50%;
      color: #e875a2;
      font-size: 14px;

      box-shadow:
        0 4px 9px rgba(160,60,100,0.14);

      z-index: 3;
    }

    .photo-card:hover {
      transform:
        translateY(-10px)
        scale(1.035)
        rotate(0deg);

      box-shadow:
        0 18px 38px rgba(150,60,100,0.2),
        0 0 0 5px rgba(255,255,255,0.7),
        0 0 25px rgba(245,130,175,0.2);
    }

    .photo-card:nth-child(odd) {
      transform: rotate(-1.3deg);
    }

    .photo-card:nth-child(even) {
      transform: rotate(1.3deg);
    }

    .photo-card:nth-child(odd):hover,
    .photo-card:nth-child(even):hover {
      transform:
        translateY(-10px)
        scale(1.035)
        rotate(0deg);
    }

    .photo-card img {
      display: block;

      width: auto !important;
      height: auto !important;

      max-width: 230px !important;
      max-height: 290px !important;

      object-fit: contain;

      border-radius: 11px;
      margin: 0;

      box-shadow:
        0 4px 10px rgba(150,60,100,0.12);
    }


    /* =========================================================
       VOICE MESSAGE
    ========================================================= */

    .voice {
      position: relative;
      z-index: 1;

      background: rgba(255,255,255,0.3);

      padding: 23px;
      border-radius: 20px;
      margin-top: 15px;

      color: #743550;

      border:
        1px solid rgba(255,190,215,0.45);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .voice-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .audio-visual {
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 4px;
      margin: 10px 0;
    }

    .audio-bar {
      width: 4px;
      border-radius: 5px;

      background:
        linear-gradient(
          to top,
          #d85c8d,
          #f3a7c2
        );

      animation:
        audioWave
        1s
        ease-in-out
        infinite
        alternate;
    }

    .audio-bar:nth-child(1) { height: 12px; animation-delay: .1s; }
    .audio-bar:nth-child(2) { height: 25px; animation-delay: .25s; }
    .audio-bar:nth-child(3) { height: 38px; animation-delay: .4s; }
    .audio-bar:nth-child(4) { height: 20px; animation-delay: .15s; }
    .audio-bar:nth-child(5) { height: 32px; animation-delay: .3s; }
    .audio-bar:nth-child(6) { height: 16px; animation-delay: .5s; }
    .audio-bar:nth-child(7) { height: 28px; animation-delay: .2s; }
    .audio-bar:nth-child(8) { height: 40px; animation-delay: .35s; }
    .audio-bar:nth-child(9) { height: 22px; animation-delay: .45s; }
    .audio-bar:nth-child(10) { height: 13px; animation-delay: .15s; }
    .audio-bar:nth-child(11) { height: 29px; animation-delay: .4s; }

    @keyframes audioWave {
      from {
        transform: scaleY(0.55);
        opacity: 0.65;
      }

      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    audio {
      width: 100%;
      margin-top: 8px;
      accent-color: #d95b8b;
    }


    /* =========================================================
       LULU CAT SECTION
    ========================================================= */

    .lulu-section {
      text-align: center;
      padding: 50px 25px 35px;
    }

    .lulu-question {
      font-size: 25px;
      color: #bd4778;
      margin-bottom: 10px;
    }

    .lulu-subtitle {
      color: #805067;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .lulu-buttons {
      display: flex;
      justify-content: center;
      gap: 13px;
      flex-wrap: wrap;
    }

    .lulu-btn {
      border: none;
      padding: 13px 27px;
      border-radius: 999px;

      font-family: inherit;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .yes-btn {
      color: white;

      background:
        linear-gradient(
          135deg,
          #dc6794,
          #c84d7d
        );

      box-shadow:
        0 8px 20px rgba(190,65,115,0.25);
    }

    .no-btn {
      color: #b54b76;

      background:
        rgba(255,255,255,0.75);

      border:
        1px solid rgba(224,126,163,0.35);
    }

    .lulu-btn:hover {
      transform: translateY(-3px) scale(1.04);
    }

    .lulu-btn:active {
      transform: scale(0.96);
    }

    .lulu-message {
      display: none;

      margin-top: 30px;

      color: #a63e6b;
      font-size: 19px;
      line-height: 1.8;

      animation:
        luluMessageIn
        0.8s
        ease both;
    }

    .lulu-message.show {
      display: block;
    }

    @keyframes luluMessageIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================================
       INTERACTABLE WHITE CAT
    ========================================================= */

    .lulu {
      display: none;

      position: relative;

      width: 210px;
      height: 230px;

      margin: 25px auto 5px;

      cursor: pointer;

      animation:
        catAppear
        0.8s
        cubic-bezier(.2,.8,.2,1)
        both;
    }

    .lulu.show {
      display: block;
    }

    @keyframes catAppear {
      from {
        opacity: 0;
        transform:
          translateY(70px)
          scale(0.65);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .cat-shadow {
      position: absolute;

      left: 50%;
      bottom: 2px;

      width: 130px;
      height: 23px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        rgba(151,72,105,0.13);

      filter: blur(7px);

      animation:
        catShadow
        2.5s
        ease-in-out
        infinite;
    }

    @keyframes catShadow {
      0%, 100% {
        transform: translateX(-50%) scaleX(0.9);
        opacity: 0.55;
      }

      50% {
        transform: translateX(-50%) scaleX(1.05);
        opacity: 0.3;
      }
    }

    .cat-body {
      position: absolute;

      left: 50%;
      bottom: 17px;

      width: 116px;
      height: 105px;

      transform: translateX(-50%);

      border-radius:
        52% 52% 45% 45%;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #fffafd 55%,
          #f3eaf0 100%
        );

      box-shadow:
        inset -9px -8px 16px rgba(192,170,183,0.18),
        inset 7px 6px 13px rgba(255,255,255,0.95),
        0 12px 22px rgba(135,69,100,0.16);

      animation:
        catBreath
        3s
        ease-in-out
        infinite;
    }

    @keyframes catBreath {
      0%, 100% {
        transform: translateX(-50%) scale(1);
      }

      50% {
        transform: translateX(-50%) scale(1.018);
      }
    }

    .cat-head {
      position: absolute;

      left: 50%;
      top: 31px;

      width: 116px;
      height: 101px;

      transform: translateX(-50%);

      border-radius:
        50% 50% 46% 46%;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #fffafd 60%,
          #eee6ed 100%
        );

      box-shadow:
        inset -8px -7px 14px rgba(186,164,179,0.17),
        inset 7px 5px 13px rgba(255,255,255,0.95),
        0 8px 17px rgba(135,69,100,0.15);

      z-index: 5;
    }

    .cat-ear {
      position: absolute;

      top: 13px;

      width: 48px;
      height: 57px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f5edf2
        );

      z-index: 3;

      box-shadow:
        0 4px 9px rgba(135,69,100,0.1);
    }

    .cat-ear.left {
      left: 38px;

      transform:
        rotate(-27deg)
        skewY(-8deg);

      border-radius:
        9px
        30px
        8px
        30px;
    }

    .cat-ear.right {
      right: 38px;

      transform:
        rotate(27deg)
        skewY(8deg);

      border-radius:
        30px
        9px
        30px
        8px;
    }

    .cat-ear::after {
      content: "";

      position: absolute;

      inset: 11px;

      background:
        linear-gradient(
          145deg,
          #ffd9e7,
          #f7b8cf
        );

      border-radius:
        9px
        24px
        7px
        24px;

      opacity: 0.7;
    }

    .cat-face {
      position: absolute;
      inset: 0;
      z-index: 8;
    }

    .cat-eye {
      position: absolute;

      top: 44px;

      width: 14px;
      height: 18px;

      background:
        radial-gradient(
          circle at 50% 42%,
          #ffffff 0 8%,
          #6e5260 10% 100%
        );

      border-radius: 50%;

      box-shadow:
        0 1px 3px rgba(80,40,60,0.18);

      animation:
        catBlink
        4.5s
        infinite;
    }

    .cat-eye.left {
      left: 28px;
    }

    .cat-eye.right {
      right: 28px;
    }

    @keyframes catBlink {
      0%, 45%, 48%, 100% {
        transform: scaleY(1);
      }

      46%, 47% {
        transform: scaleY(0.08);
      }
    }

    .cat-nose {
      position: absolute;

      left: 50%;
      top: 66px;

      width: 9px;
      height: 7px;

      transform: translateX(-50%);

      background: #e995b4;

      border-radius:
        50% 50% 60% 60%;

      z-index: 10;
    }

    .cat-mouth {
      position: absolute;

      left: 50%;
      top: 72px;

      width: 22px;
      height: 12px;

      transform: translateX(-50%);

      z-index: 10;
    }

    .cat-mouth::before,
    .cat-mouth::after {
      content: "";

      position: absolute;

      top: 0;

      width: 11px;
      height: 7px;

      border-bottom:
        2px solid #916274;

      border-radius: 0 0 50% 50%;
    }

    .cat-mouth::before {
      left: 0;
      transform: rotate(12deg);
    }

    .cat-mouth::after {
      right: 0;
      transform: rotate(-12deg);
    }

    .whiskers {
      position: absolute;

      top: 68px;

      width: 45px;
      height: 20px;
    }

    .whiskers.left {
      left: -31px;
    }

    .whiskers.right {
      right: -31px;
    }

    .whiskers span {
      position: absolute;

      width: 40px;
      height: 1px;

      background: rgba(111,77,93,0.4);
    }

    .whiskers.left span:nth-child(1) {
      top: 3px;
      right: 0;
      transform: rotate(-8deg);
    }

    .whiskers.left span:nth-child(2) {
      top: 10px;
      right: 2px;
      transform: rotate(5deg);
    }

    .whiskers.left span:nth-child(3) {
      top: 17px;
      right: 0;
      transform: rotate(16deg);
    }

    .whiskers.right span:nth-child(1) {
      top: 3px;
      left: 0;
      transform: rotate(8deg);
    }

    .whiskers.right span:nth-child(2) {
      top: 10px;
      left: 2px;
      transform: rotate(-5deg);
    }

    .whiskers.right span:nth-child(3) {
      top: 17px;
      left: 0;
      transform: rotate(-16deg);
    }

    .cat-paw {
      position: absolute;

      bottom: 17px;

      width: 39px;
      height: 55px;

      border-radius:
        50% 50% 43% 43%;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #eee7ed
        );

      box-shadow:
        inset -5px -5px 9px rgba(174,150,164,0.14);

      z-index: 10;

      transition:
        transform 0.3s ease;
    }

    .cat-paw.left {
      left: 25px;
      transform: rotate(17deg);
    }

    .cat-paw.right {
      right: 25px;
      transform: rotate(-17deg);
    }

    .lulu:hover .cat-paw.left {
      transform:
        rotate(17deg)
        translateY(-7px);
    }

    .lulu:hover .cat-paw.right {
      transform:
        rotate(-17deg)
        translateY(-7px);
    }

    .cat-tail {
      position: absolute;

      right: 25px;
      bottom: 54px;

      width: 76px;
      height: 85px;

      border:
        14px solid #f7f1f5;

      border-left-color: transparent;
      border-bottom-color: transparent;

      border-radius: 50%;

      transform: rotate(22deg);

      filter:
        drop-shadow(
          3px 4px 3px rgba(130,70,100,0.12)
        );

      z-index: 1;

      animation:
        tailWag
        2.8s
        ease-in-out
        infinite;
    }

    @keyframes tailWag {
      0%, 100% {
        transform: rotate(22deg);
      }

      50% {
        transform: rotate(8deg);
      }
    }

    .cat-bow {
      position: absolute;

      left: 50%;
      top: 103px;

      transform: translateX(-50%);

      z-index: 12;
    }

    .bow-piece {
      display: inline-block;

      width: 27px;
      height: 19px;

      background:
        linear-gradient(
          145deg,
          #f28daf,
          #ce5b86
        );

      box-shadow:
        0 3px 5px rgba(150,50,90,0.17);
    }

    .bow-left {
      border-radius:
        18px
        5px
        5px
        18px;

      transform: rotate(15deg);
    }

    .bow-right {
      border-radius:
        5px
        18px
        18px
        5px;

      transform: rotate(-15deg);
    }

    .bow-center {
      display: inline-block;

      width: 12px;
      height: 12px;

      margin: 0 -3px;

      border-radius: 50%;

      background: #f7a5c0;

      vertical-align: 3px;
    }

    .cat-heart {
      position: absolute;

      top: -5px;
      right: -10px;

      font-size: 25px;
      color: #e36e9b;

      opacity: 0;

      animation:
        heartPop
        2.5s
        ease-in-out
        infinite;
    }

    @keyframes heartPop {
      0%, 65%, 100% {
        opacity: 0;
        transform: translateY(8px) scale(0.5);
      }

      75% {
        opacity: 1;
        transform: translateY(-3px) scale(1);
      }

      90% {
        opacity: 0;
        transform: translateY(-15px) scale(0.75);
      }
    }

    .cat-caption {
      color: #a94670;
      font-size: 15px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {

        padding: 30px 0;

        margin-bottom: 10px;
      }

      .photos {

        align-items: center;
      }

      .photo-card {
        max-width: 100%;

      .photo-card img {
        max-width: 245px !important;
        max-height: 300px !important;
      }

      .sound-wave {
        width: 115vw;
        gap: 4px;
        opacity: 0.12;
      }

      .lulu {
        transform: scale(0.9);
        margin-top: 15px;
        margin-bottom: -10px;
      }

      .lulu.show {
        animation:
          catAppearMobile
          0.8s
          cubic-bezier(.2,.8,.2,1)
          both;
      }

      @keyframes catAppearMobile {
        from {
          opacity: 0;
          transform: translateY(70px) scale(0.55);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(0.9);
        }
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
